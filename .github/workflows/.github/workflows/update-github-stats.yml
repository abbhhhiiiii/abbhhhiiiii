name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folder
        run: mkdir -p github-stats

      - name: Download Streak
        run: |
          curl -L "https://streak-stats.demolab.com?user=abbhhhiiiii&theme=github-dark&hide_border=true&background=0D1117" \
          -o github-stats/streak.svg

      - name: Download Contribution Graph
        run: |
          curl -L "https://github-readme-activity-graph.vercel.app/graph?username=abbhhhiiiii&theme=github-dark&bg_color=0d1117&color=58a6ff&line=7ee787&point=58a6ff&area=true&hide_border=true" \
          -o github-stats/contribution-graph.svg

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub Stats"
            git push
          fi
