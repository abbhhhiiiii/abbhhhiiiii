name: GitHub Profile Summary Cards

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: abbhhhiiiii
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
